<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="bgGrad" x1="54" y1="0" x2="54" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23242B"/>
      <stop offset="0.55" stop-color="#121216"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="54" cy="56" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B3B9C9" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#B3B9C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="walletGrad" x1="23" y1="36" x2="85" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4F5F9"/>
      <stop offset="1" stop-color="#8F96AB"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle (Theme V2 tiered obsidian) -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)"/>
  <rect width="108" height="108" rx="24" fill="url(#glowGrad)"/>
  <rect width="108" height="108" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Foreground Artwork: Adaptive icon Slate wallet -->
  <g transform="translate(14.76, 16.812) scale(0.72)">
    <!-- Flap peeking behind the body -->
    <g transform="rotate(-8, 51, 38)">
      <path fill="#8F96AB" fill-opacity="0.55" d="M38,26 H64 A7,7 0 0 1 71,33 V43 A7,7 0 0 1 64,50 H38 A7,7 0 0 1 31,43 V33 A7,7 0 0 1 38,26 Z"/>
    </g>

    <!-- Body -->
    <path d="M36,36 H72 A13,13 0 0 1 85,49 V67 A13,13 0 0 1 72,80 H36 A13,13 0 0 1 23,67 V49 A13,13 0 0 1 36,36 Z" fill="url(#walletGrad)"/>

    <!-- Top fold highlight -->
    <path d="M23,49 A13,13 0 0 1 36,36 H72 A13,13 0 0 1 85,49 Z" fill="#FFFFFF" fill-opacity="0.24"/>

    <!-- Rim light -->
    <path d="M36,36 H72 A13,13 0 0 1 85,49 V67 A13,13 0 0 1 72,80 H36 A13,13 0 0 1 23,67 V49 A13,13 0 0 1 36,36 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>

    <!-- Clasp -->
    <path d="M68.5,51 H77.5 A8.5,8.5 0 0 1 77.5,68 H68.5 A8.5,8.5 0 0 1 68.5,51 Z" fill="#101014" stroke="#B3B9C9" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- Cycle ring: track -->
    <path d="M73,54.3 A5.2,5.2 0 1 1 73,64.7 A5.2,5.2 0 1 1 73,54.3 Z" fill="none" stroke="#B3B9C9" stroke-opacity="0.3" stroke-width="2.2"/>

    <!-- Cycle ring: lit arc (70%) -->
    <path d="M73,54.3 A5.2,5.2 0 1 1 68.05,61.11" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Centre dot -->
    <path d="M74.6,59.5 A1.6,1.6 0 1 1 71.4,59.5 A1.6,1.6 0 1 1 74.6,59.5 Z" fill="#FFFFFF"/>
  </g>
</svg>